services:
  client:
    image: docker.cnb.cool/sra_lei/datapolit-client:latest
    container_name: datapolit-client
    env_file:
      - .client-env.production
    ports:
      - "80:80"
    networks:
      - datapolit-network
    depends_on:
      - core
      - rag
    restart: unless-stopped

  core:
    image: docker.cnb.cool/sra_lei/datapolit-core:latest
    container_name: datapolit-core
    env_file:
      - .core-env.production
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/data/logs
    networks:
      - datapolit-network
    restart: unless-stopped

  rag:
    image: docker.cnb.cool/sra_lei/datapolit-rag:latest
    container_name: datapolit-rag
    env_file:
      - .rag-env.production
    environment:
      - CHROMA_DIR=/app/data/chroma_db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datapolit-network
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: datapolit-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: datapolit-mysql
    env_file:
      - .core-env.production
    volumes:
      - mysql_data:/var/lib/mysql
      # 唯一权威 init 脚本：services/core/database/init/init.sql（deploy 不再单独维护一份）
      - ../services/core/database/init:/docker-entrypoint-initdb.d
    networks:
      - datapolit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  datapolit-network:
    driver: bridge
